name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Guard Against Runtime Artifacts In Git
        run: |
          set -euo pipefail
          forbidden='(\.db($|[-.])|\.sqlite3?$|\.db-(wal|shm|journal)$|:Zone\.Identifier$|^jaskmoney$)'
          tracked="$(git ls-files | grep -E "${forbidden}" || true)"
          if [ -n "${tracked}" ]; then
            echo "Forbidden runtime/generated artifacts are tracked:"
            echo "${tracked}"
            exit 1
          fi

      - name: Run Tests
        run: go test ./...

      - name: Startup Diagnostics Harness
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
        run: go run . -startup-check
