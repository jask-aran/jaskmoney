name: Installer

on:
  push:
    branches: [main]
    paths: [scripts/install.sh, scripts/test-install.sh, .github/workflows/installer.yml]
  pull_request:
    paths: [scripts/install.sh, scripts/test-install.sh, .github/workflows/installer.yml]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, mode: release }
          - { runner: ubuntu-latest, mode: source }
          - { runner: macos-latest, mode: source }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-install.sh ${{ matrix.mode }}
