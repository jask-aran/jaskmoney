# The app: OpenTUI's Solid transform with a disk cache (src/jsxCache.ts).
preload = ["./src/jsxCache.ts"]

# Solid must resolve the browser/dev build, not solid-js/server (orphan text crashes).
[test]
# testSetup points the settings config at a scratch file (never the user's).
preload = ["@opentui/solid/preload", "./src/testSetup.ts"]
